name: Fetch public Whisper base model

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch-runtime:
    if: github.head_ref == 'tmp/fetch-whisper-runtime-20260722'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download public multilingual base model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -L --fail --retry 5 --retry-delay 2 \
            -o runtime/ggml-base-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin?download=true'
          sha256sum runtime/* | tee runtime/SHA256SUMS.txt
          ls -lh runtime
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-base-model
          path: runtime/
          if-no-files-found: error
          retention-days: 1
