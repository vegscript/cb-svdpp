name: Fetch public Demucs model

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch-runtime:
    if: github.head_ref == 'tmp/fetch-whisper-runtime-20260722'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download public Demucs voice-separation model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -L --fail --retry 5 --retry-delay 2 \
            -o runtime/955717e8-8726e21a.th \
            'https://dl.fbaipublicfiles.com/demucs/hybrid_transformer/955717e8-8726e21a.th'
          sha256sum runtime/* | tee runtime/SHA256SUMS.txt
          ls -lh runtime
      - uses: actions/upload-artifact@v4
        with:
          name: demucs-voice-model
          path: runtime/
          if-no-files-found: error
          retention-days: 1
